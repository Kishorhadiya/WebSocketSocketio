services:
  # Backend API & Socket.IO Web Service
  - type: web
    name: websocket-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: PORT
        value: 5001
      - key: CLIENT_URL
        sync: false
      - key: MONGO_URL
        sync: false
      - key: KEY_1
        sync: false
      - key: KEY_2
        sync: false
      - key: PUBLIC_KEY
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: URL_ENDPOINT
        sync: false

  # Frontend Static Site
  - type: web
    name: websocket-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
